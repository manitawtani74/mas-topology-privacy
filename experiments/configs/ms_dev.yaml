# Minimal DEVELOPMENT config for the meeting-scheduling smoke test.
# Purpose: cheapest possible end-to-end run to confirm the pipeline works and
# to measure real token cost. NOT a research cell (only 2 agents, 1 iteration).
#
# Differences from examples/configs/meeting_scheduling.yaml:
#   - provider: openai + gpt-4.1-mini   (the paper's primary model; the repo
#     default was foundry/gpt-5.4-nano, which we don't have keys for)
#   - 2 agents, 1 iteration, 1 planning round  -> minimal API calls
#
# The openai client auto-strips gpt-5-only params (reasoning_effort/verbosity)
# for non-gpt-5 models, so leaving them out here is cleanest.

simulation:
  max_iterations: 1
  max_planning_rounds: 1
  max_conversation_steps: 3
  seed: 42
  tags:
    - dev_smoke

environment:
  name: MeetingSchedulingEnvironment
  assignment_filling: false
  num_meetings: 2
  timeline_length: 12
  min_participants: 2
  max_participants: 2
  soft_meeting_ratio: 0.6

communication_network:
  # 2 agents + complete => a single shared blackboard (both agents on it).
  topology: complete
  num_agents: 2
  consolidate_channels: true

llm:
  provider: "openai"
  openai:
    model: "gpt-4.1-mini-2025-04-14"
    params:
      max_tokens: 1024
      temperature: 0.7
