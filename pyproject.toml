[project]
name = "mas-topology-privacy"
version = "0.1.0"
description = "Incidental privacy leakage vs. communication-topology density in a cooperative multi-agent system (built on Terrarium)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "manitawtani" }]

# Terrarium is used UNMODIFIED as a dependency (not vendored except one attributed
# run-loop; see experiments/runner/_terrarium_run.py). The extras below mirror what
# the study needs: providers (openai), science (numpy/pandas/scipy), plots (matplotlib).
dependencies = [
    "terrarium-agents[providers,science,plots]>=0.2.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "networkx>=3.3",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.1.1",
]

# NOTE: CoLLAB is NOT a pip package. Clone https://github.com/Saad-Mahmud/CoLLAB_SEA
# and set TERRARIUM_COLLAB_PATH to it (see README).

[project.optional-dependencies]
docs = ["markdown>=3.5"]   # only for `python -m experiments.analysis.render_html`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]
